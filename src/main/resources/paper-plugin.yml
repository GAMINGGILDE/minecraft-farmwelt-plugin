name: Farmwelt
version: ${version}
main: de.minecraftgilde.farmwelt.FarmweltPlugin
api-version: "26.1.2"
author: CFPlusPlus
folia-supported: true
description: Farmwelt-System für den Minecraft-Gilde-Server.
dependencies:
  server:
    Worlds:
      load: BEFORE
      required: true
      join-classpath: true
    BetterRTP:
      load: BEFORE
      required: false
      join-classpath: false
    GriefPrevention:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  farmwelt.use:
    description: Darf /farmwelt verwenden.
    default: true
  farmwelt.bypass:
    description: Wird vom Ressourcenmonitor ignoriert.
    default: op
  farmwelt.notify:
    description: Erhält Moderator-Benachrichtigungen.
    default: op
  farmwelt.admin:
    description: Darf Diagnose- und alle getrennten Admin-Funktionen verwenden.
    default: op
    children:
      farmwelt.admin.status: true
      farmwelt.admin.reload: true
      farmwelt.admin.reset: true
  farmwelt.admin.status:
    description: Darf den Reset-Status der Farmwelten anzeigen.
    default: op
  farmwelt.admin.reload:
    description: Darf die Farmwelt-Konfiguration neu laden.
    default: op
  farmwelt.admin.reset:
    description: Darf einen sofortigen manuellen Farmwelt-Reset starten.
    default: op
